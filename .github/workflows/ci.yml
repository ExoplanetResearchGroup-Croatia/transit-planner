name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # unit tests, astropy reference tests, exporter golden-file tests
      - run: npm test
      # validates equipment.json and the catalog snapshot, type-checks, builds
      - run: npm run build
