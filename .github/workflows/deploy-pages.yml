name: Deploy to GitHub Pages

# Live at https://exoplanetresearchgroup-croatia.github.io/transit-planner/
# Deploys on every push to main, after each catalog refresh, and on demand.
# Requirements: Settings > Pages > Source = "GitHub Actions"; on the free
# organization plan the repository must stay public.
on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Refresh catalog snapshot']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
